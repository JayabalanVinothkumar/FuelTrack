<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>FuelTrack</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a4;
  --acc:#3d8bff;--ok:#2ec27e;--warn:#f5a524;--bad:#ef5350;--p:#6cb6ff;--c:#f5a524;--f:#c77dff;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1}
.datebar{display:flex;align-items:center;gap:6px}
.datebar button{background:var(--card2);border:0;border-radius:10px;width:34px;height:32px;font-size:18px}
.datebar span{min-width:96px;text-align:center;font-weight:600}
main{padding:12px 12px calc(var(--sab) + 90px)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{color:var(--mut);font-weight:500}
.mut{color:var(--mut)}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.eq{display:flex;justify-content:space-between;text-align:center;font-size:12px;color:var(--mut);margin-top:10px}
.eq b{display:block;font-size:17px;color:var(--txt)}
.ring{width:118px;height:118px;flex:none}
.bars .bar{margin:7px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.track{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:3px}
.track i{display:block;height:100%;border-radius:5px}
.meal .item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.meal .item:first-of-type{border-top:0}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc{font-weight:600}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--acc);color:#fff;font-weight:600}
.btn.sec{background:var(--card2);color:var(--txt)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 0}
.btn.danger{background:transparent;color:var(--bad)}
.btn.blk{width:100%}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .btn{flex:1;padding:9px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(24,27,34,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
nav.tabs .cam{margin-top:-18px}
nav.tabs .cam span{width:54px;height:54px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;box-shadow:0 4px 16px rgba(61,139,255,.45)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:14px 14px calc(var(--sab) + 18px);transform:translateY(100%);transition:transform .25s}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=password],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.list .li:active{background:var(--card2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.photo-prev{width:100%;max-height:300px;object-fit:cover;border-radius:14px;background:var(--card2)}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:8px;background:var(--card2);color:var(--mut)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);background:#2b313d;padding:10px 16px;border-radius:12px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.big{font-size:28px;font-weight:700}
.water{display:flex;flex-wrap:wrap;gap:6px}
.water button{width:36px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-size:18px}
.water button.on{background:#1f4f8f;border-color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:16px 0;font-size:13px}
svg text{fill:var(--mut);font-size:10px}
.hidden{display:none!important}
.spin{width:18px;height:18px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1 id="title">Diary</h1>
  <div class="datebar" id="datebar">
    <button id="dPrev" aria-label="Previous day">‹</button>
    <span id="dLabel">Today</span>
    <button id="dNext" aria-label="Next day">›</button>
  </div>
</header>
<main id="main"></main>

<nav class="tabs" id="tabs">
  <button data-tab="dash" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Today</button>
  <button data-tab="diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Diary</button>
  <button data-tab="photo" class="cam"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>Snap</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="libInput" accept="image/*" class="hidden">
<input type="file" id="importInput" accept="application/json" class="hidden">

/* ======================= STORAGE (IndexedDB) ======================= */
const DB = (()=>{
  let dbp;
  function open(){ if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{ const r=indexedDB.open("fueltrack",1);
      r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore("kv"); d.createObjectStore("photos"); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    return dbp; }
  async function tx(store,mode,fn){ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode); const s=t.objectStore(store); const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); }); }
  return {
    get:(k,store="kv")=>tx(store,"readonly",s=>s.get(k)),
    set:(k,v,store="kv")=>tx(store,"readwrite",s=>s.put(v,k)),
    del:(k,store="kv")=>tx(store,"readwrite",s=>s.delete(k)),
    keys:(store="kv")=>tx(store,"readonly",s=>s.getAllKeys()),
  };
})();

const r0=n=>Math.round(n||0); const r1=n=>Math.round((n||0)*10)/10;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
let curDate = iso(new Date());
function dayLabel(ds){ const t=iso(new Date()); if(ds===t) return "Today";
  const y=new Date(); y.setDate(y.getDate()-1); if(ds===iso(y)) return "Yesterday";
  const tm=new Date(); tm.setDate(tm.getDate()+1); if(ds===iso(tm)) return "Tomorrow";
  return new Date(ds+"T12:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}); }
function day(ds=curDate){ if(!S.days[ds]) S.days[ds]={food:[],ex:[],water:0,notes:""}; return S.days[ds]; }
function totals(ds=curDate){ const d=S.days[ds]; const t={kcal:0,p:0,c:0,f:0,ex:0};
  if(!d) return t; d.food.forEach(i=>{t.kcal+=i.kcal;t.p+=i.p;t.c+=i.c;t.f+=i.f;}); d.ex.forEach(e=>t.ex+=e.kcal); return t; }
function macroGoals(){ const g=S.goals; return {p:g.kcal*g.pPct/100/4, c:g.kcal*g.cPct/100/4, f:g.kcal*g.fPct/100/9}; }
function curWeight(){ const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1); return w.length?w[w.length-1].kg:(S.profile?.weight||70); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2200); }
function allFoods(){ return [...S.custom.map(f=>({...f,cat:"My Foods"})), ...FOODS]; }
function findFood(id){ return allFoods().find(f=>f.id===id); }
function entryFrom(food,grams,meal,extra={}){ const k=grams/100;

function ring(pct,color,label,sub){ const R=50,C=2*Math.PI*R,p=Math.max(0,Math.min(1,pct));
  return `<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#2a2f3a" stroke-width="11"/>
  <circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 60 60)"/>
  <text x="60" y="58" text-anchor="middle" style="fill:var(--txt);font-size:22px;font-weight:700">${label}</text>
  <text x="60" y="76" text-anchor="middle" style="font-size:11px">${sub}</text></svg>`; }
function bar(label,v,goal,color,unit="g"){ const pct=goal?Math.min(100,v/goal*100):0;
  return `<div class="bar"><div class="lbl"><span>${label}</span><span>${r0(v)} / ${r0(goal)} ${unit}</span></div><div class="track"><i style="width:${pct}%;background:${v>goal*1.05?'var(--bad)':color}"></i></div></div>`; }

function renderDash(){
  const t=totals(), g=S.goals, mg=macroGoals(), d=day();

  const streak=calcStreak();
  return `
  <div class="card">
    <h2>Calories <small>Remaining = Goal − Food + Exercise</small></h2>
    <div class="row">
      ${ring(pct, rem<0?'var(--bad)':'var(--acc)', r0(rem), rem<0?'over':'remaining')}
      <div class="grow bars">
        ${bar("Protein",t.p,mg.p,"var(--p)")}
        ${bar("Carbs",t.c,mg.c,"var(--c)")}
        ${bar("Fat",t.f,mg.f,"var(--f)")}
      </div>
    </div>
    <div class="eq"><div><b>${r0(g.kcal)}</b>Goal</div><div><b>−${r0(t.kcal)}</b>Food</div><div><b>+${r0(t.ex)}</b>Exercise</div><div><b style="color:${rem<0?'var(--bad)':'var(--ok)'}">${r0(rem)}</b>Left</div></div>
  </div>
  <div class="grid2">
    <div class="card" onclick="openWater()"><div class="mut sm">💧 Water</div><div class="big">${d.water}<span class="mut sm"> / ${g.water} glasses</span></div></div>
    <div class="card" onclick="openWeight()"><div class="mut sm">⚖️ Weight</div><div class="big">${r1(curWeight())}<span class="mut sm"> kg</span></div></div>
    <div class="card" onclick="openExercise()"><div class="mut sm">🔥 Exercise</div><div class="big">${r0(t.ex)}<span class="mut sm"> kcal · ${d.ex.reduce((a,e)=>a+e.min,0)} min</span></div></div>
    <div class="card"><div class="mut sm">🏆 Streak</div><div class="big">${streak}<span class="mut sm"> day${streak===1?'':'s'}</span></div></div>
  </div>
  <div class="card">
    <h2>Quick add</h2>
    <div class="grid2">
      <button class="btn" onclick="startPhoto()">📷 Snap a meal</button>
      <button class="btn sec" onclick="openSearch(guessMeal())">🔍 Search food</button>
      <button class="btn sec" onclick="openQuickAdd(guessMeal())">⚡ Quick calories</button>
      <button class="btn sec" onclick="openExercise()">🏃 Exercise</button>
    </div>
  </div>
  ${!S.profile?`<div class="card"><h2>Set your goal</h2><p class="mut sm">Tell me about yourself and I'll calculate a daily calorie and macro target.</p><button class="btn blk" onclick="openGoals()">Set up goals</button></div>`:""}
  ${mealCards(true)}`;
}
function guessMeal(){ const h=new Date().getHours(); return h<11?"Breakfast":h<15?"Lunch":h<17?"Snacks":h<22?"Dinner":"Snacks"; }
function calcStreak(){ let n=0; const d=new Date(); if(!(S.days[iso(d)]?.food.length)) d.setDate(d.getDate()-1);
  while(S.days[iso(d)]?.food.length){ n++; d.setDate(d.getDate()-1); } return n; }

function mealCards(compact){
  const d=day();
  return MEALS.map(m=>{ const items=d.food.filter(i=>i.meal===m); const kc=items.reduce((a,i)=>a+i.kcal,0);
    if(compact && !items.length) return "";
    return `<div class="card meal"><h2>${m} <small>${r0(kc)} kcal</small></h2>
      ${items.map(i=>`<div class="item" onclick="editEntry('${i.id}')">
        ${i.photo?`<img class="thumb" data-pid="${i.photo}" alt="">`:""}
        <div class="grow"><div class="nm">${esc(i.name)}</div><div class="mut sm">${i.grams?r0(i.grams)+" g · ":""}P ${r0(i.p)} · C ${r0(i.c)} · F ${r0(i.f)}${i.ai?' · <span class="pill">AI</span>':''}</div></div>
        <div class="kc">${r0(i.kcal)}</div></div>`).join("") || `<div class="empty">Nothing logged</div>`}
      ${compact?"":`<div class="addrow"><button class="btn sec" onclick="openSearch('${m}')">+ Food</button><button class="btn sec" onclick="startPhoto('${m}')">📷</button><button class="btn sec" onclick="mealMenu('${m}')">⋯</button></div>`}
    </div>`; }).join("");
}

function renderDiary(){

  <div class="mut sm" style="margin-top:8px">Macro split today: Protein ${r0(t.p*4/tot*100)}% · Carbs ${r0(t.c*4/tot*100)}% · Fat ${r0(t.f*9/tot*100)}%</div>`; }
function waterHTML(){ const d=day(), n=Math.max(S.goals.water,d.water+1);
  return `<div class="water">${Array.from({length:n},(_,i)=>`<button class="${i<d.water?'on':''}" onclick="setWater(${i<d.water&&i===d.water-1?i:i+1})">💧</button>`).join("")}</div><div class="mut sm" style="margin-top:6px">${d.water} × 250 ml = ${d.water*0.25} L</div>`; }

let searchCat="All";

  openSheet(`<h3>Add to ${meal} <button class="btn ghost" onclick="closeSheet()">Close</button></h3>

    <div class="grid3" style="margin-bottom:6px">

      <button class="btn sec" onclick="openSavedMeals('${meal}')">⭐ Meals</button>
    </div>
    <div class="list" id="res"></div>`, b=>{
    const cats=["All","Recent","My Foods",...new Set(FOODS.map(f=>f.cat))];
    const draw=()=>{ const q=b.querySelector("#q").value.trim().toLowerCase();
      b.querySelector("#cats").innerHTML=cats.map(c=>`<button class="chip ${c===searchCat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
      b.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{searchCat=ch.dataset.c;draw();});
      let list=allFoods();
      if(searchCat==="Recent") list=S.recent.map(findFood).filter(Boolean);
      else if(searchCat!=="All") list=list.filter(f=>f.cat===searchCat);
      if(q){ const words=q.split(/\s+/); list=list.filter(f=>{ const h=(f.name+" "+(f.tags||"")).toLowerCase(); return words.every(w=>h.includes(w)); });
        list.sort((a,b)=>(a.name.toLowerCase().startsWith(q)?0:1)-(b.name.toLowerCase().startsWith(q)?0:1)); }
      else if(searchCat==="All"){ const rec=S.recent.map(findFood).filter(Boolean); list=[...rec,...list.filter(f=>!S.recent.includes(f.id))]; }
      b.querySelector("#res").innerHTML=list.slice(0,80).map(f=>`<div class="li" data-id="${f.id}"><div class="grow"><div class="nm">${esc(f.name)}</div><div class="mut sm">${esc(f.sLabel)} (${r0(f.sG)} g) · ${r0(f.kcal*f.sG/100)} kcal</div></div><span style="color:var(--acc);font-size:22px">＋</span></div>`).join("")||`<div class="empty">No match. Use "New food" or "Quick" to add it.</div>`;

    b.querySelector("#q").oninput=draw; draw();

}
function openPortion(fid,meal,photoId,editId){
  const f=findFood(fid); if(!f){toast("Food not found");return;}
  const ex=editId?day().food.find(i=>i.id===editId):null;
  let mode="serv", qty=ex? r1(ex.grams/f.sG) : 1;
  openSheet(`<h3>${esc(f.name)} <button class="btn ghost" onclick="closeSheet()">Cancel</button></h3>
    <div class="seg" id="mode"><button data-m="serv" class="on">${esc(f.sLabel)}</button><button data-m="g">grams</button></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="minus" style="width:52px">−</button><input type="number" id="qty" inputmode="decimal" step="0.25" value="${qty}" style="text-align:center;font-size:20px"><button class="btn sec" id="plus" style="width:52px">＋</button></div>
    <label class="f">Meal</label><select id="meal">${MEALS.map(m=>`<option ${m===(ex?.meal||meal)?'selected':''}>${m}</option>`).join("")}</select>
    <div class="card" style="background:var(--card2);margin-top:12px"><div class="eq" style="margin:0" id="nut"></div></div>
    <button class="btn blk" id="ok">${ex?"Update":"Add"}</button>`, b=>{
    const qi=b.querySelector("#qty");
    const grams=()=>{ const v=parseFloat(qi.value)||0; return mode==="serv"?v*f.sG:v; };
    const upd=()=>{ const k=grams()/100; b.querySelector("#nut").innerHTML=`<div><b>${r0(f.kcal*k)}</b>kcal</div><div><b>${r1(f.p*k)}</b>Protein</div><div><b>${r1(f.c*k)}</b>Carbs</div><div><b>${r1(f.f*k)}</b>Fat</div>`; };
    b.querySelectorAll("#mode button").forEach(x=>x.onclick=()=>{ const g=grams(); mode=x.dataset.m; b.querySelectorAll("#mode button").forEach(y=>y.classList.toggle("on",y===x)); qi.value=mode==="g"?r0(g):r1(g/f.sG); qi.step=mode==="g"?10:0.25; upd(); });
    b.querySelector("#minus").onclick=()=>{ qi.value=Math.max(0,(parseFloat(qi.value)||0)-(mode==="g"?10:0.5)); upd(); };
    b.querySelector("#plus").onclick=()=>{ qi.value=(parseFloat(qi.value)||0)+(mode==="g"?10:0.5); upd(); };
    qi.oninput=upd; upd();
    b.querySelector("#ok").onclick=()=>{ const g=grams(); if(g<=0){toast("Enter an amount");return;}
      const m=b.querySelector("#meal").value; const d=day();
      if(ex){ Object.assign(ex, entryFrom(f,g,m,{id:ex.id,photo:ex.photo})); }
      else d.food.push(entryFrom(f,g,m,photoId?{photo:photoId}:{}));
      pushRecent(f.id); save(); closeSheet(); render(); toast(`${ex?"Updated":"Added"} ${f.name}`); };
  });
}

function keyType(k){ k=(k||"").trim(); return k.startsWith("AIza")?"gemini":k.startsWith("sk-ant")?"anthropic":k.startsWith("sk-or-")?"openrouter":null; }
function normalizeKeys(){ const st=S.settings;

function saveAISettings(){ const k=$('#ak').value.replace(/\s+/g,""), m=$('#am').value.trim(); let t=keyType(k)||S.settings.provider;

function aiKey(){ return primaryKey()||S.settings.openrouterKey; }
function httpErr(status,msg){ const e=new Error(msg); e.status=status; return e; }
async function callPrimary(b64,prompt){
  const s=S.settings;
  if(s.provider==="gemini"){
    const model=(s.geminiModel||"gemini-flash-latest").replace(/^models\//,"");
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",
      headers:{"content-type":"application/json","x-goog-api-key":s.geminiKey},
      body:JSON.stringify({contents:[{role:"user",parts:[{inline_data:{mime_type:"image/jpeg",data:b64}},{text:prompt}]}],generationConfig:{responseMimeType:"application/json"}})});
    if(!res.ok){ let msg=await res.text(); try{msg=JSON.parse(msg).error.message;}catch{}
      if(/API key not valid|API_KEY_INVALID/i.test(msg)) msg="Gemini says the key is not valid. Copy it again from aistudio.google.com → API keys.";
      else if(res.status===403) msg="Gemini refused the key (403). In AI Studio/Google Cloud, remove website restrictions on the key or allow the Generative Language API. ("+msg+")";
      else if(res.status===404) msg="Model '"+model+"' not found. Set the model to gemini-flash-latest.";
      else if(res.status===429) msg="Gemini quota reached — wait a minute and try again.";
      throw httpErr(res.status,"Gemini "+res.status+": "+String(msg).slice(0,220)); }
    const j=await res.json(); const parts=j.candidates?.[0]?.content?.parts||[];
    const txt=parts.filter(p=>!p.thought).map(p=>p.text||"").join(""); if(!txt) throw new Error(j.promptFeedback?.blockReason||"Empty reply from Gemini"); return txt;
  }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":s.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:s.model||"claude-sonnet-5-5",max_tokens:1024,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt}]}]})});
  if(!res.ok){ const t=await res.text(); throw httpErr(res.status,"Claude "+res.status+": "+(res.status===401?"key rejected by Anthropic. If you meant to use Gemini, paste your AIza… key under Google Gemini.":t.slice(0,140))); }
  const j=await res.json(); return j.content.map(c=>c.text||"").join("");
}
async function callOpenRouter(b64,prompt){
  const s=S.settings; const model=s.openrouterModel||"openrouter/free";
  const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",
    headers:{"content-type":"application/json","authorization":"Bearer "+s.openrouterKey,"HTTP-Referer":location.origin,"X-Title":"FuelTrack"},
    body:JSON.stringify({model,messages:[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}}]}]})});
  if(!res.ok){ let msg=await res.text(); try{msg=JSON.parse(msg).error.message;}catch{}
    if(res.status===401) msg="OpenRouter key not valid. Copy it again from openrouter.ai/keys.";
    else if(res.status===429) msg="OpenRouter free limit reached for today.";
    else if(res.status===404) msg="Model '"+model+"' not available. Use openrouter/free.";
    throw httpErr(res.status,"OpenRouter "+res.status+": "+String(msg).slice(0,200)); }
  const j=await res.json(); if(j.error) throw httpErr(502,"OpenRouter: "+(j.error.message||"error"));
  const c=j.choices?.[0]?.message?.content; const txt=Array.isArray(c)?c.map(x=>x.text||"").join(""):(c||"");
  if(!txt) throw new Error("Empty reply from OpenRouter"); return {text:txt, model:j.model||model};
}
function primaryKey(){ const s=S.settings; return s.provider==="gemini"?s.geminiKey:s.apiKey; }
function primaryName(){ return S.settings.provider==="gemini"?"Gemini":"Claude"; }
// Returns {text, via}. Falls back to OpenRouter when the primary is out of quota, overloaded or unreachable.
async function callAI(b64,prompt){
  const s=S.settings;
  if(!primaryKey()){ if(!s.openrouterKey) throw new Error("No AI key set"); const r=await callOpenRouter(b64,prompt); return {text:r.text,via:"OpenRouter · "+r.model}; }
  try{ return {text:await callPrimary(b64,prompt), via:primaryName()}; }
  catch(e){
    const recoverable = !e.status || e.status===429 || e.status>=500;
    if(!s.openrouterKey || !recoverable) throw e;
    const r=await callOpenRouter(b64,prompt);
    return {text:r.text, via:"OpenRouter backup · "+r.model, fallbackReason:e.message};
  }
}

      ${canAI?`<button class="btn blk" id="aiBtn">✨ Estimate calories with ${S.settings.provider==="gemini"?"Gemini":"Claude"}</button>`:`<div class="card" style="background:var(--card2)"><div class="sm">${!online?"📴 You're offline.":"🔑 No AI key set."} Pick what's on the plate:</div></div>`}
    </div>
    <div class="grid2" style="margin-top:8px"><button class="btn sec" id="pick">🔍 Pick foods</button><button class="btn sec" id="quick">⚡ Enter calories</button></div>`, b=>{
    const meal=()=>{photoMeal=b.querySelector("#pm").value; return photoMeal;};
    b.querySelector("#pick").onclick=()=>openSearch(meal(),pid);
    b.querySelector("#quick").onclick=()=>openQuickAdd(meal(),pid);
    const ab=b.querySelector("#aiBtn"); if(ab) ab.onclick=()=>runAI(pid,aiData,meal(),b);
    if(canAI) runAI(pid,aiData,meal(),b);
  });
}
async function runAI(pid,dataUrl,meal,b){
  const box=b.querySelector("#aiBox"); box.innerHTML=`<div class="card" style="background:var(--card2)"><span class="spin"></span> Analysing your plate…</div>`;
  try{
    const prompt=`You are a nutrition estimator. Identify each distinct food or drink in this photo and estimate the portion in grams and its nutrition. Consider plate size and typical serving sizes; This user mostly eats Tamil Nadu / South Indian food (idli, dosa, sambar, rasam, kuzhambu, poriyal, curd rice, biryani, parotta) and also German food; use Tamil dish names where they fit and account for ghee and oil. Reply ONLY with JSON: {"items":[{"name":string,"grams":number,"kcal":number,"protein":number,"carbs":number,"fat":number}],"confidence":"low"|"medium"|"high","note":string}`;
    const ai=await callAI(dataUrl.split(",")[1],prompt); const txt=ai.text; const m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("Unexpected AI reply"); const out=JSON.parse(m[0]);
    const items=(out.items||[]).map(i=>({name:i.name,grams:+i.grams||0,kcal:+i.kcal||0,p:+i.protein||0,c:+i.carbs||0,f:+i.fat||0,on:true,scale:1}));
    if(!items.length) throw new Error("No food recognised");
    const draw=()=>{ const tot=items.filter(i=>i.on).reduce((a,i)=>a+i.kcal*i.scale,0);
      box.innerHTML=`<div class="card" style="background:var(--card2)"><h2>AI estimate <small>${esc(out.confidence||"")} confidence</small></h2><div class="mut sm" style="margin:-6px 0 4px">via ${esc(ai.via)}${ai.fallbackReason?" — "+esc(primaryName())+" was unavailable":""}</div>
        ${items.map((i,k)=>`<div class="item" style="display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)">
          <input type="checkbox" data-k="${k}" ${i.on?"checked":""} style="width:22px;height:22px">
          <div class="grow"><div class="nm">${esc(i.name)}</div><div class="mut sm">${r0(i.grams*i.scale)} g · P ${r0(i.p*i.scale)} C ${r0(i.c*i.scale)} F ${r0(i.f*i.scale)}</div></div>
          <select data-s="${k}" style="width:76px;padding:6px">${[0.5,0.75,1,1.25,1.5,2].map(s=>`<option value="${s}" ${s===i.scale?'selected':''}>×${s}</option>`).join("")}</select>
          <div class="kc" style="width:44px;text-align:right">${r0(i.kcal*i.scale)}</div></div>`).join("")}
        ${out.note?`<div class="mut sm" style="margin-top:6px">${esc(out.note)}</div>`:""}
        <div class="row" style="margin-top:10px"><div class="grow big">${r0(tot)} <span class="mut sm">kcal</span></div><button class="btn" id="aiAdd">Add to ${esc(meal)}</button></div></div>`;
      box.querySelectorAll("[data-k]").forEach(x=>x.onchange=()=>{items[x.dataset.k].on=x.checked;draw();});
      box.querySelectorAll("[data-s]").forEach(x=>x.onchange=()=>{items[x.dataset.s].scale=+x.value;draw();});
      box.querySelector("#aiAdd").onclick=()=>{ const ml=b.querySelector("#pm").value; let first=true;
        items.filter(i=>i.on).forEach(i=>{ day().food.push({id:uid(),meal:ml,name:i.name,grams:r0(i.grams*i.scale),kcal:r1(i.kcal*i.scale),p:r1(i.p*i.scale),c:r1(i.c*i.scale),f:r1(i.f*i.scale),ai:true,photo:first?pid:undefined}); first=false; });
        save(); closeSheet(); render(); toast("Meal logged"); };
    }; draw();
  }catch(err){ box.innerHTML=`<div class="card" style="background:var(--card2)"><div class="sm" style="color:var(--warn)">AI estimate failed: ${esc(err.message)}</div><div class="mut sm">Pick the foods manually below.</div></div>`; }
}

    <label class="f">Minutes</label><input type="number" id="em" inputmode="numeric" value="30">

function delEx(id){ day().ex=day().ex.filter(e=>e.id!==id); save(); render(); }

/* ======================= WEIGHT & PROGRESS ======================= */
function openWeight(){
  openSheet(`<h3>Log weight <button class="btn ghost" onclick="closeSheet()">Cancel</button></h3>
    <div class="grid2"><div><label class="f">Date</label><input type="date" id="wd" value="${iso(new Date())}"></div><div><label class="f">Weight (kg)</label><input type="number" id="wk" inputmode="decimal" step="0.1" value="${r1(curWeight())}"></div></div>
    <button class="btn blk" style="margin-top:12px" id="ok">Save</button>`, b=>{
    b.querySelector("#ok").onclick=()=>{ const d=b.querySelector("#wd").value, kg=+b.querySelector("#wk").value; if(!kg) return;
      S.weights=S.weights.filter(w=>w.d!==d); S.weights.push({d,kg}); S.weights.sort((a,b)=>a.d<b.d?-1:1); save(); closeSheet(); render(); toast("Weight saved"); }; });
}
function lineChart(pts,{h=150,goal=null,unit=""}={}){
  if(pts.length<2) return `<div class="empty">Log at least 2 entries to see a chart.</div>`;
  const W=340,P=28; const ys=pts.map(p=>p.y).concat(goal!=null?[goal]:[]); let mn=Math.min(...ys),mx=Math.max(...ys); if(mx-mn<1){mx+=1;mn-=1;} const pad=(mx-mn)*0.1; mn-=pad; mx+=pad;
  const X=i=>P+(W-P-8)*i/(pts.length-1), Y=v=>8+(h-26)*(1-(v-mn)/(mx-mn));
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${h}" width="100%">
    ${[mn+pad,(mn+mx)/2,mx-pad].map(v=>`<line x1="${P}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2f3a"/><text x="0" y="${Y(v)+3}">${r1(v)}</text>`).join("")}
    ${goal!=null?`<line x1="${P}" x2="${W}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="4 4"/>`:""}
    <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="var(--acc)"/>`).join("")}
    <text x="${P}" y="${h-2}">${esc(pts[0].x)}</text><text x="${W}" y="${h-2}" text-anchor="end">${esc(pts[pts.length-1].x)}</text></svg>`; }
function barChart(vals,goal,h=150){ const W=340,P=6; const mx=Math.max(goal*1.2,...vals.map(v=>v.y),1); const bw=(W-P*2)/vals.length;
  const Y=v=>h-18-(h-28)*(v/mx);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%">
    <line x1="0" x2="${W}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="4 4"/>
    ${vals.map((v,i)=>`<rect x="${P+i*bw+bw*0.18}" y="${Y(v.y)}" width="${bw*0.64}" height="${Math.max(0,h-18-Y(v.y))}" rx="4" fill="${v.y>goal?'var(--warn)':'var(--acc)'}"/>
    <text x="${P+i*bw+bw/2}" y="${h-4}" text-anchor="middle">${esc(v.x)}</text>`).join("")}</svg>`; }
let progRange=7;
function renderProgress(){
  const days=[]; for(let i=progRange-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(iso(d)); }
  const vals=days.map(ds=>({x:progRange<=7?new Date(ds+"T12:00").toLocaleDateString(undefined,{weekday:"narrow"}):String(+ds.slice(8)),y:totals(ds).kcal}));
  const logged=days.filter(ds=>S.days[ds]?.food.length); const avg=logged.length?logged.reduce((a,ds)=>a+totals(ds).kcal,0)/logged.length:0;
  const mAvg=k=>logged.length?logged.reduce((a,ds)=>a+totals(ds)[k],0)/logged.length:0;
  const ws=S.weights.slice(-30).map(w=>({x:new Date(w.d+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}),y:w.kg}));
  const start=S.weights[0]?.kg, now=curWeight();
  const exAvg=logged.length?days.reduce((a,ds)=>a+totals(ds).ex,0)/progRange:0;
  return `<div class="seg" style="margin-bottom:12px">${[7,14,30].map(n=>`<button class="${n===progRange?'on':''}" onclick="progRange=${n};render()">${n} days</button>`).join("")}</div>
  <div class="card"><h2>Calories <small>avg ${r0(avg)} / goal ${r0(S.goals.kcal)}</small></h2>${barChart(vals,S.goals.kcal)}</div>
  <div class="card"><h2>Weight <small>${start?`${now-start>0?"+":""}${r1(now-start)} kg since start`:""}</small></h2>${lineChart(ws,{goal:S.profile?.targetWeight??null})}
    <button class="btn sec blk" onclick="openWeight()">＋ Log weight</button></div>
  <div class="card"><h2>Average macros <small>${logged.length} logged day(s)</small></h2>${(()=>{const mg=macroGoals();return bar("Protein",mAvg("p"),mg.p,"var(--p)")+bar("Carbs",mAvg("c"),mg.c,"var(--c)")+bar("Fat",mAvg("f"),mg.f,"var(--f)");})()}
    <div class="mut sm" style="margin-top:8px">Avg exercise burn: ${r0(exAvg)} kcal/day</div></div>
  ${S.profile?`<div class="card"><h2>Projection</h2><div class="sm">If every day looked like your ${progRange}-day average, in 5 weeks you'd weigh about <b>${r1(now + ((avg - exAvg - tdee())*35)/7700)} kg</b>.</div><div class="mut sm">Estimate from your maintenance calories (${r0(tdee())} kcal). Only counts logged days.</div></div>`:""}`;
}

/* ======================= GOALS ======================= */
const ACT=[["Sedentary (desk job)",1.2],["Lightly active",1.375],["Active",1.55],["Very active",1.725]];
function bmr(p=S.profile){ return 10*(p.weight)+6.25*p.height-5*p.age+(p.sex==="m"?5:-161); }
function tdee(p=S.profile){ return p?bmr({...p,weight:curWeight()})*ACT[p.activity][1]:2000; }
function openGoals(){
  const p=S.profile||{sex:"m",age:30,height:175,weight:75,activity:0,rate:-0.5,targetWeight:70};
  openSheet(`<h3>Goals <button class="btn ghost" onclick="closeSheet()">Cancel</button></h3>
    <div class="seg" id="sx"><button data-v="m" class="${p.sex==='m'?'on':''}">Male</button><button data-v="f" class="${p.sex==='f'?'on':''}">Female</button></div>
    <div class="grid3"><div><label class="f">Age</label><input type="number" id="ga" value="${p.age}"></div><div><label class="f">Height cm</label><input type="number" id="gh" value="${p.height}"></div><div><label class="f">Weight kg</label><input type="number" id="gw" step="0.1" value="${r1(S.weights.length?curWeight():p.weight)}"></div></div>
    <label class="f">Activity level</label><select id="gl">${ACT.map((a,i)=>`<option value="${i}" ${i==p.activity?'selected':''}>${a[0]}</option>`).join("")}</select>
    <label class="f">Weekly goal</label><select id="gr">${[[-1,"Lose 1 kg/week"],[-0.75,"Lose 0.75 kg/week"],[-0.5,"Lose 0.5 kg/week"],[-0.25,"Lose 0.25 kg/week"],[0,"Maintain weight"],[0.25,"Gain 0.25 kg/week"],[0.5,"Gain 0.5 kg/week"]].map(([v,l])=>`<option value="${v}" ${v==p.rate?'selected':''}>${l}</option>`).join("")}</select>
    <label class="f">Target weight (kg)</label><input type="number" id="gt" step="0.1" value="${p.targetWeight??""}">
    <div class="card" style="background:var(--card2);margin-top:12px" id="calc"></div>
    <label class="f">Macro split (% protein / carbs / fat)</label>
    <div class="grid3"><input type="number" id="mp" value="${S.goals.pPct}"><input type="number" id="mc" value="${S.goals.cPct}"><input type="number" id="mf" value="${S.goals.fPct}"></div>
    <div class="grid2"><div><label class="f">Daily calories (override)</label><input type="number" id="gk" placeholder="auto"></div><div><label class="f">Water goal (glasses)</label><input type="number" id="gwt" value="${S.goals.water}"></div></div>
    <button class="btn blk" style="margin-top:14px" id="ok">Save goals</button>`, b=>{
    let sex=p.sex; b.querySelectorAll("#sx button").forEach(x=>x.onclick=()=>{sex=x.dataset.v;b.querySelectorAll("#sx button").forEach(y=>y.classList.toggle("on",y===x));upd();});
    const read=()=>({sex,age:+b.querySelector("#ga").value,height:+b.querySelector("#gh").value,weight:+b.querySelector("#gw").value,activity:+b.querySelector("#gl").value,rate:+b.querySelector("#gr").value,targetWeight:+b.querySelector("#gt").value||null});
    const target=pp=>{ const t=bmr(pp)*ACT[pp.activity][1]; return Math.max(pp.sex==="m"?1500:1200, Math.round((t+pp.rate*7700/7)/10)*10); };
    const upd=()=>{ const pp=read(); const t=bmr(pp)*ACT[pp.activity][1];
      b.querySelector("#calc").innerHTML=`<div class="eq" style="margin:0"><div><b>${r0(bmr(pp))}</b>BMR</div><div><b>${r0(t)}</b>Maintenance</div><div><b style="color:var(--acc)">${target(pp)}</b>Daily goal</div></div>`; };
    b.querySelectorAll("input,select").forEach(x=>x.addEventListener("input",upd)); upd();
    b.querySelector("#ok").onclick=()=>{ const pp=read(); const mp=+b.querySelector("#mp").value,mc=+b.querySelector("#mc").value,mf=+b.querySelector("#mf").value;
      if(mp+mc+mf!==100){toast("Macros must add up to 100%");return;}
      S.profile=pp; S.goals={kcal:+b.querySelector("#gk").value||target(pp),pPct:mp,cPct:mc,fPct:mf,water:+b.querySelector("#gwt").value||8};
      if(!S.weights.length||curWeight()!==pp.weight){ const d=iso(new Date()); S.weights=S.weights.filter(w=>w.d!==d); S.weights.push({d,kg:pp.weight}); S.weights.sort((a,c)=>a.d<c.d?-1:1); }
      save(); closeSheet(); render(); toast("Goals updated"); };
  });
}

/* ======================= MORE / SETTINGS ======================= */
function renderMore(){
  const g=S.goals;
  return `<div class="card"><h2>Goals</h2><div class="sm">${r0(g.kcal)} kcal · P ${g.pPct}% / C ${g.cPct}% / F ${g.fPct}% · ${g.water} glasses water</div><button class="btn sec blk" style="margin-top:10px" onclick="openGoals()">Edit goals</button></div>
  <div class="card"><h2>My foods <small>${S.custom.length}</small></h2><div class="list">${S.custom.map(f=>`<div class="li" onclick="openCustomFood(null,'${f.id}')"><div class="grow">${esc(f.name)}<div class="mut sm">${r0(f.kcal)} kcal / 100 g</div></div>›</div>`).join("")||`<div class="empty">Add foods from nutrition labels.</div>`}</div><button class="btn sec blk" style="margin-top:8px" onclick="openCustomFood()">＋ New food</button></div>
  <div class="card"><h2>Saved meals <small>${S.saved.length}</small></h2><button class="btn sec blk" onclick="openSavedMeals(guessMeal())">View saved meals</button></div>
  <div class="card"><h2>AI photo recognition (optional)</h2>
    <p class="mut sm" style="margin-top:0">The app works fully offline. With an API key, the Snap button identifies food and estimates calories automatically when you have internet. The key stays on this phone and photos go straight to the provider.</p>
    <div class="seg" id="prov"><button data-p="gemini" class="${S.settings.provider==='gemini'?'on':''}" onclick="S.settings.provider='gemini';save();render()">Google Gemini</button><button data-p="anthropic" class="${S.settings.provider==='anthropic'?'on':''}" onclick="S.settings.provider='anthropic';save();render()">Claude</button></div>
    ${S.settings.provider==='gemini'?`
    <label class="f">Gemini API key</label><input type="password" id="ak" value="${esc(S.settings.geminiKey)}" placeholder="AIza…" autocomplete="off">
    <label class="f">Model</label><input type="text" id="am" value="${esc(S.settings.geminiModel)}">
    <div class="mut sm" style="margin-top:6px">Get a free key at aistudio.google.com → Get API key. "gemini-flash-latest" always uses Google's newest Flash model.</div>
    <button class="btn sec blk" style="margin-top:10px" onclick="const t=saveAISettings();toast('Saved ('+({gemini:'Gemini',anthropic:'Claude',openrouter:'OpenRouter backup'}[t])+')');render()">Save AI settings</button>`:`
    <label class="f">Anthropic API key</label><input type="password" id="ak" value="${esc(S.settings.apiKey)}" placeholder="sk-ant-…" autocomplete="off">
    <label class="f">Model</label><input type="text" id="am" value="${esc(S.settings.model)}">
    <button class="btn sec blk" style="margin-top:10px" onclick="const t=saveAISettings();toast('Saved ('+({gemini:'Gemini',anthropic:'Claude',openrouter:'OpenRouter backup'}[t])+')');render()">Save AI settings</button>`}
    <button class="btn ghost blk" onclick="testAI()">Test connection</button></div>
  <div class="card"><h2>Backup AI: OpenRouter (free)</h2>
    <p class="mut sm" style="margin-top:0">Used automatically when ${esc(primaryName())} hits its daily limit, is overloaded or fails. Also used on its own if no other key is set. Get a free key at openrouter.ai → Keys.</p>
    <label class="f">OpenRouter API key</label><input type="password" id="ork" value="${esc(S.settings.openrouterKey)}" placeholder="sk-or-v1-…" autocomplete="off">
    <label class="f">Model</label><input type="text" id="orm" value="${esc(S.settings.openrouterModel)}">
    <div class="mut sm" style="margin-top:6px">"openrouter/free" picks a free vision model automatically. To pin one, paste a model id ending in ":free" from openrouter.ai/models.</div>
    <div class="grid2" style="margin-top:10px"><button class="btn sec" onclick="saveOR();toast('Backup saved')">Save</button><button class="btn sec" onclick="testOR()">Test backup</button></div></div>
  <div class="card"><h2>Backup</h2><p class="mut sm" style="margin-top:0">Your data lives only on this phone. Export a backup now and then.</p>
    <div class="grid2"><button class="btn sec" onclick="exportData()">⬇️ Export</button><button class="btn sec" onclick="$('#importInput').click()">⬆️ Import</button></div></div>
  <div class="card"><h2>About</h2><div class="mut sm">FuelTrack v1.4 · ${FOODS.length} built-in foods · Calorie estimates are approximate; not medical advice.</div>
    <button class="btn danger blk" onclick="resetAll()">Erase all data</button></div>`;
}
async function exportData(){
  const photos={}; for(const k of await DB.keys("photos")) photos[k]=await DB.get(k,"photos");
  const blob=new Blob([JSON.stringify({v:1,state:S,photos})],{type:"application/json"}); const name=`fueltrack-backup-${iso(new Date())}.json`;
  const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e.name==="AbortError") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
$("#importInput").onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const j=JSON.parse(await f.text()); if(!j.state) throw 0; S={...structuredClone(DEFAULT_STATE),...j.state}; for(const [k,v] of Object.entries(j.photos||{})) await DB.set(k,v,"photos"); save(); render(); toast("Backup restored"); }catch{ toast("Not a valid backup file"); } };
function resetAll(){ openSheet(`<h3>Erase everything?</h3><p class="mut">This deletes your diary, foods, weights and photos from this phone.</p><div class="grid2"><button class="btn sec" onclick="closeSheet()">Cancel</button><button class="btn" style="background:var(--bad)" id="y">Erase</button></div>`, b=>{
  b.querySelector("#y").onclick=async()=>{ for(const k of await DB.keys("photos")) await DB.del(k,"photos"); S=structuredClone(DEFAULT_STATE); await DB.set("state",S); closeSheet(); render(); toast("Erased"); }; }); }

/* ======================= BOOT ======================= */
(async()=>{
  try{ S=await DB.get("state"); }catch(e){}
  S={...structuredClone(DEFAULT_STATE),...(S||{})}; S.settings={...DEFAULT_STATE.settings,...S.settings}; normalizeKeys(); migrateFoodIds();
  render();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    const hadCtrl=!!navigator.serviceWorker.controller; let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadCtrl&&!reloaded){ reloaded=true; location.reload(); } });
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) r.update().catch(()=>{}); }); }).catch(()=>{}); }
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ const t=iso(new Date()); if(tab==="dash") render(); } });
})();
</script>
